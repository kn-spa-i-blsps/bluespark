# =============================================================================
# docker-compose.bench.yml  —  BENCH TESTING on the governer Pi
#
# Brings up the FULL flight-control stack (mavros + rc_override + vehicle_manager)
# but NO mission — so you can run bench tests by hand without hand-starting
# mavros every time.
#
# It uses governer.launch.py with run_autonomy:=false, which starts the stack in
# the correct staggered order (mavros t=0, rc_override t=3, vehicle_manager t=5)
# and then just holds — no autonomy_node, no supervisor, no auto-mission.
#
# WORKFLOW:
#   docker compose -f docker-compose.prod.yml down       # stop prod first!
#   docker compose -f docker-compose.bench.yml up -d     # stack comes up in background
#   docker compose -f docker-compose.bench.yml logs -f   # (optional) watch it start
#   docker exec -it bluespark_bench bash                 # jump in
#     source install/setup.bash
#     ros2 run bluespark_autonomy benchTest --ros-args -p mission:=wiggle
#
#   # need a second terminal (e.g. emergency disarm)? same container, any time:
#   docker exec -it bluespark_bench bash
#     ros2 service call /manager/set_arming std_srvs/srv/SetBool "{data: false}"
#
#   docker compose -f docker-compose.bench.yml down      # tear it all down
#
# Stable name (bluespark_bench) + up -d means you can open as many exec shells
# as you want, in any order, and closing one does NOT kill the stack.
#
# Never run this and prod at the same time on one Pi: both drive the same
# serial port and thrusters.
# =============================================================================

services:
  bluespark_bench:
    build: .
    container_name: bluespark_bench

    # Host network + privileged: cross-Pi ROS 2 discovery + hardware (serial/I2C).
    network_mode: host
    privileged: true

    volumes:
      - .:/workspace # live-mounted code; git pull + restart, no rebuild
      - /dev:/dev # serial (Pixhawk), I2C, etc.

    environment:
      - ROS_DOMAIN_ID=42 # MUST match every other Pi
      - ROS_LOCALHOST_ONLY=0

    # Build (offline-safe) then bring up ONLY the stack, no mission.
    #   - NO `pip install` here: everything is already in the image, so this
    #     works with no internet.
    #   - run_autonomy:=false -> mavros + control only, autonomy_node skipped.
    command: >
      bash -c '
        source /opt/ros/jazzy/setup.bash &&
        colcon build --symlink-install --parallel-workers 2 &&
        source /workspace/install/setup.bash &&
        exec ros2 launch bluespark_bringup governer.launch.py run_autonomy:=false
      '

    stop_grace_period: 20s

    # Bench: do NOT auto-restart. If the stack dies you want to see why, not have
    # it silently loop.
    restart: "no"
