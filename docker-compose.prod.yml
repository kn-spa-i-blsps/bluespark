# =============================================================================
# docker-compose.prod.yml  —  PRODUCTION / ON-VEHICLE
#
# The SAME image on every Pi; the ROLE is chosen by WHICH_RPI (from .env):
#     front | down | side  -> camera role: runs `ros2 launch <role>.launch.py`
#     brain                -> control+autonomy role: runs run_governer.sh, the
#                             supervisor that owns build + launch + restart/disarm
#
# Naming note:
#   - "brain" is the ROLE / namespace of the main Pi (brain.launch.py).
#   - run_governer.sh is the SUPERVISOR SCRIPT that the brain role runs; it is
#     the one thing that calls brain.launch.py and adds crash-restart + disarm.
#   So: role = brain, supervisor = governer. They are not the same thing.
#
# Set the role per Pi in a local .env file (NOT committed; see .gitignore):
#     echo "WHICH_RPI=down" > .env
#
# Run:
#     docker compose -f docker-compose.prod.yml up
# =============================================================================

version: '3.8'

services:
  bluespark:
    build: .
    container_name: bluespark_${WHICH_RPI:-unset}

    # Host network + privileged: required for cross-Pi ROS 2 discovery and for
    # hardware access (camera / I2C / serial).
    network_mode: host
    privileged: true

    volumes:
      # Live-mounted code: update a Pi with `git pull` + restart, no image rebuild.
      - .:/workspace
      - /dev:/dev
      # No X11 — the Pis are headless.

    environment:
      - ROS_DOMAIN_ID=42        # MUST be identical on all four Pis.
      - ROS_LOCALHOST_ONLY=0
      - WHICH_RPI=${WHICH_RPI:?set WHICH_RPI in .env (front|down|side|brain)}

    # Role dispatch:
    #   brain -> hand off to run_governer.sh (it builds, launches brain.launch.py,
    #            and supervises: restart on crash, disarm on exit).
    #   else  -> build once, then ros2 launch <role>.launch.py directly.
    #
    # Camera roles build here so a plain `git pull` + restart picks up code
    # changes without rebuilding the image.
    command: >
      bash -c '
        source /opt/ros/humble/setup.bash &&
        if [ "$WHICH_RPI" = "brain" ]; then
          exec bash /workspace/run_governer.sh ;
        else
          colcon build --symlink-install --parallel-workers 2 &&
          source /workspace/install/setup.bash &&
          exec ros2 launch bluespark_bringup ${WHICH_RPI}.launch.py ;
        fi
      '

    restart: unless-stopped
