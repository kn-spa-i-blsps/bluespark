version: '3.8'

services:
  bluespark_dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: bluespark:dev
    container_name: bluespark_dev

    # Host networking enables zero-overhead DDS discovery across containers and hardware
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true

    volumes:
      # Live-mount workspace for hot reloading code changes
      - .:/workspace
      - /dev:/dev
      # Forward X11 so OpenCV / PyPlot windows can render on your monitor
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0

    # Compiles workspace with symlinks and drops into an interactive shell
    command: >
      bash -c '
        source /opt/ros/jazzy/setup.bash &&
        colcon build --symlink-install --parallel-workers 2 &&
        source /workspace/install/setup.bash &&
        exec bash
      '

    restart: "no"

  # --- Two-terminal laptop test: one container per role, shared image/workspace.
  # Build first with `docker compose -f docker-compose.dev.yml run --rm bluespark_dev`
  # (it colcon-builds into ./install), then see DEV_TEST.md.
  front:
    image: bluespark:dev
    container_name: bluespark_front
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
    command: >
      bash -c '
        source /opt/ros/jazzy/setup.bash &&
        source /workspace/install/setup.bash &&
        exec ros2 launch bluespark_bringup front.launch.py camera_mode:=usb
      '
    restart: "no"

  governer:
    image: bluespark:dev
    container_name: bluespark_governer
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - /dev:/dev
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
    # Shell only: stack + mission are started by hand (see DEV_TEST.md).
    command: >
      bash -c '
        source /opt/ros/jazzy/setup.bash &&
        source /workspace/install/setup.bash &&
        exec bash
      '
    restart: "no"
